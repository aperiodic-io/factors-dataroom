name: Generate Notebooks

on:
  workflow_dispatch:

  schedule:
    - cron: '0 6 * * 1'

  # Regenerate + execute the notebooks whenever a generation *input* changes.
  # On main this opens a refresh PR (see the create-pull-request step below); on
  # any other branch it commits the executed notebooks straight back to that
  # branch, updating its PR. Scoped to the inputs: the generated notebooks'
  # sources (notebooks/src, scripts, deps) plus the two hand-maintained notebooks,
  # whose source lives in the .ipynb itself so an edit to one must re-execute it.
  # A data-only or factsheet commit touches none of these paths, so it doesn't
  # rebuild the notebooks. The workflow's own commit-back can't loop even though
  # it now touches push-path files: it is pushed with GITHUB_TOKEN, whose pushes
  # never start a new workflow run.
  push:
    branches:
      - '**'
      - '!automation/**'
    paths:
      - 'notebooks/src/**'
      - 'notebooks/00_multi_factor_portfolio_construction.ipynb'
      - 'notebooks/00_portfolio_integration.ipynb'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/generate-notebooks.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate & execute factor notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APERIODIC_API_KEY: ${{ secrets.APERIODIC_API_KEY }}
      NOTEBOOK_JOBS: '4'

    steps:
      # Pinned to v5: actions/checkout@v6 breaks the create-pull-request
      # step below with `remote: Duplicate header: "Authorization"` (HTTP
      # 400). Revert to @v6 once the upstream incompatibility is fixed.
      # https://github.com/peter-evans/create-pull-request/issues/4272
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify API key is configured
        run: |
          if [ -z "$APERIODIC_API_KEY" ]; then
            echo "::error::APERIODIC_API_KEY secret is not configured"
            exit 1
          fi

      - name: Generate and execute notebooks
        run: python -m scripts.generate_factor_notebooks --execute

      - name: Show notebook execution report
        # Surface the per-notebook failure tracebacks in the (readable) job log.
        # The generator captures nbconvert output into ci-artifacts/ (uploaded as
        # an artifact); echo it here too so a failure is diagnosable straight from
        # the logs. `always()` so it runs even when the step above exits non-zero.
        if: always()
        run: |
          echo "===== ci-artifacts/execution_report.md ====="
          cat ci-artifacts/execution_report.md 2>/dev/null || echo "(no report written)"
          echo
          echo "===== per-notebook execution logs (tail) ====="
          shopt -s nullglob
          for log in ci-artifacts/execution_logs/*.log; do
            echo "----- ${log} -----"
            tail -n 40 "${log}"
            echo
          done

      - name: Execute the multi-factor portfolio notebook
        # Hand-maintained notebook (not generated from scripts/factors_catalog.py),
        # so it lives outside generate_factor_notebooks.py. Execute it in place
        # against the live API so the committed copy carries rendered outputs.
        # `always()` refreshes it independently of the catalog notebooks above;
        # the commit / PR steps below already stage all of notebooks/.
        if: always()
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=1800 \
            notebooks/00_multi_factor_portfolio_construction.ipynb

      - name: Execute the portfolio-integration notebook
        # Also hand-maintained (self-contained, no src). Executed in a separate
        # always() step so it runs against the live API regardless of the
        # multi-factor notebook's result; the commit / PR steps stage all of
        # notebooks/.
        if: always()
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=1800 \
            notebooks/00_portfolio_integration.ipynb

      - name: Redact any leaked secrets from notebooks
        if: always()
        run: python -m scripts.redact_secrets notebooks/*.ipynb

      # Must run last, after execution + redaction: strips the per-run cell ids,
      # execution timing metadata, and kernel pid so the committed-back notebooks
      # only diff on real content changes (see scripts/clean_notebooks.py).
      - name: Strip transient notebook metadata
        if: always()
        run: python -m scripts.clean_notebooks notebooks/

      - name: Upload notebooks artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebooks
          path: notebooks/
          if-no-files-found: error

      - name: Upload execution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-diagnostics
          path: ci-artifacts/
          if-no-files-found: ignore

      - name: Commit executed notebooks back to the branch
        # Any trigger on a non-main branch (push OR manual workflow_dispatch)
        # commits the executed notebooks straight back to that branch. Keyed on
        # the branch, not the event, so a manual re-run of a feature branch
        # refreshes it in place instead of failing at the create-PR step (which
        # only makes sense against main).
        if: ${{ always() && github.ref_name != 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notebooks/
          if git diff --cached --quiet; then
            echo "No notebook changes to commit."
            exit 0
          fi
          git commit -m "chore(Notebooks): Regenerate and execute factor notebooks

          Branch: ${GITHUB_REF_NAME}
          Triggered by: ${GITHUB_ACTOR}"
          # A concurrent run (e.g. the factsheets workflow) may push first; rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1

      - name: Open PR with refreshed notebooks
        id: cpr
        # Only on main: a refresh there lands via PR (schedule auto-merges it
        # below). Feature branches never reach here -- they commit back above.
        if: ${{ success() && github.ref_name == 'main' }}
        uses: peter-evans/create-pull-request@v6
        with:
          base: main
          branch: automation/refresh-notebooks
          add-paths: notebooks/
          commit-message: "chore(Notebooks): Regenerate and execute factor notebooks"
          title: "chore(Notebooks): Refresh factor analysis notebooks"
          body: |
            Automated regeneration of the factor notebooks from
            `scripts/factors_catalog.py`, executed against the live Aperiodic Factors API.

            Trigger: `${{ github.event_name }}`.

            Scheduled runs auto-merge once branch-protection requirements are
            met; for manual / `main` triggers, review the diff and merge.
          delete-branch: true

      - name: Auto-merge the scheduled refresh
        if: ${{ github.event_name == 'schedule' && steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR" --squash --delete-branch --auto \
            || gh pr merge "$PR" --squash --delete-branch
